<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FintechGuard - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 1.5rem; color: #1a202c; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #4a5568; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #2b6cb0; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #2c5282; }
        .error-msg { color: #e53e3e; margin-top: 1rem; font-size: 0.9rem; display: none; text-align: center; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>FintechGuard Access</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Entrar</button>
        <div id="errorMessage" class="error-msg"></div>
    </form>
</div>

<script>
    let timerInterval = null;

    // Função que inicia a contagem regressiva na tela
    function startCountdown(seconds) {
        const submitBtn = document.querySelector('button[type="submit"]');
        const errorDiv = document.getElementById('errorMessage');
        
        submitBtn.disabled = true; // Desabilita o botão
        let remainingTime = seconds;

        clearInterval(timerInterval); // Limpa timers anteriores, se houver

        timerInterval = setInterval(() => {
            const minutes = Math.floor(remainingTime / 60);
            const secs = remainingTime % 60;
            
            // Formata no padrão 00:00
            const formattedTime = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            
            errorDiv.innerText = `Usuário bloqueado por muitas tentativas. Tente novamente em: ${formattedTime}`;
            errorDiv.style.display = 'block';

            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                submitBtn.disabled = false; // Reabilita o botão ao fim do tempo
                errorDiv.style.display = 'none';
            }

            remainingTime--;
        }, 1000);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.style.display = 'none';

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access_token);
                window.location.href = '/dashboard';
            } else if (response.status === 429) {
                // Captura o bloqueio (HTTP 429) e inicia o relógio de 3 minutos (180 segundos)
                startCountdown(180);
            } else {
                errorDiv.innerText = data.detail || 'Falha na autenticação';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.innerText = 'Erro ao conectar com o servidor.';
            errorDiv.style.display = 'block';
        }
    });
</script>

</body>
</html>
