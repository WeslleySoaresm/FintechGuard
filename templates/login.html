<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FintechGuard - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/login.css') }}"
    >

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <h1>FintechGuard</h1>

                <p>
                    Atendimento Bancário Seguro
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="seu@email.com"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Entrar
                </button>

            </form>


            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>


            <div class="footer">

                FintechGuard © 2026

            </div>

        </div>

    </div>


    <script
        src="{{ url_for('static', path='js/login.js') }}"
    ></script>

</body>

</html>
