<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FintechGuard - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { margin-top: 0; color: #1a202c; }
        button { background: #2b6cb0; color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2c5282; }
        .btn-danger { background: #e53e3e; }
        .btn-danger:hover { background: #c53030; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #cbd5e0; padding: 10px; text-align: left; }
        th { background: #edf2f7; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e0; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>FintechGuard - Painel de Atendimento</h2>
        <button class="btn-danger" onclick="logout()">Sair</button>
    </div>

    <!-- Formulário para Criar Ticket -->
    <div class="card">
        <h3>Criar Novo Ticket</h3>
        <form id="createTicketForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nome do Cliente</label>
                    <input type="text" id="customer_name" required>
                </div>
                <div class="form-group">
                    <label>Email do Cliente</label>
                    <input type="email" id="customer_email" required>
                </div>
                <div class="form-group">
                    <label>Assunto</label>
                    <input type="text" id="ticket_subject" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="ticket_status">
                        <option value="Open">Aberto</option>
                        <option value="Pending">Pendente</option>
                        <option value="Closed">Fechado</option>
                    </select>
                </div>
            </div>
            <button type="submit" style="margin-top: 10px;">Salvar Ticket</button>
        </form>
    </div>

    <!-- Tabela para Listar Tickets -->
    <div class="card">
        <h3>Tickets Cadastrados</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Email</th>
                    <th>Assunto</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="ticketsTableBody">
                <tr>
                    <td colspan="5" style="text-align: center;">Carregando dados...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Valida se o usuário possui token antes de carregar a tela
    const token = localStorage.getItem('access_token');
    if (!token) {
        window.location.href = '/login';
    }

    // Função enviada por você para carregar os tickets da API
    async function fetchTickets() {
        const token = localStorage.getItem('access_token');

        try {
            const response = await fetch('/tickets/', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.status === 401) {
                alert('Sessão expirada. Faça login novamente.');
                window.location.href = '/login';
                return;
            }

            const data = await response.json();
            console.log('Tickets carregados:', data);
            renderTable(data);
        } catch (error) {
            console.error('Erro ao buscar tickets:', error);
        }
    }

    // Renderiza a lista de tickets dentro da tabela
    function renderTable(tickets) {
        const tbody = document.getElementById('ticketsTableBody');
        tbody.innerHTML = '';

        if (!tickets || tickets.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhum ticket encontrado.</td></tr>';
            return;
        }

        tickets.forEach(ticket => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${ticket["Ticket ID"] || ticket.ticket_id || '-'}</td>
                <td>${ticket["Customer Name"] || ticket.customer_name || '-'}</td>
                <td>${ticket["Customer Email"] || ticket.customer_email || '-'}</td>
                <td>${ticket["Ticket Subject"] || ticket.ticket_subject || '-'}</td>
                <td>${ticket["Ticket Status"] || ticket.ticket_status || '-'}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Evento de submissão do formulário para criar novos tickets
    document.getElementById('createTicketForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            customer_name: document.getElementById('customer_name').value,
            customer_email: document.getElementById('customer_email').value,
            ticket_subject: document.getElementById('ticket_subject').value,
            ticket_status: document.getElementById('ticket_status').value
        };

        const response = await fetch('/tickets/', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            alert('Ticket criado com sucesso!');
            document.getElementById('createTicketForm').reset();
            fetchTickets(); // Recarrega a tabela
        } else {
            alert('Erro ao criar ticket.');
        }
    });

    // Função de Logout
    function logout() {
        localStorage.removeItem('access_token');
        window.location.href = '/login';
    }

    // Executa a busca ao carregar a página
    fetchTickets();
</script>

</body>
</html>
