name: CI Security Tests

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositório (Checkout)
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13.5" # Ajuste para a versão do Python que está a usar (ex: 3.11 ou 3.13)
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Garante que pytest e testclient estão instalados caso não estejam no requirements
        pip install pytest fastapi httpx sqlmodel

    - name: Executar testes de segurança com pytest
      run: |
        pytest tests/ -v