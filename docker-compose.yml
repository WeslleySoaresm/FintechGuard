version: '3.8'

services:
  # Serviço do Redis
  redis:
    image: redis:alpine
    container_name: fintechguard-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fintech-network

  # Serviço da API FastAPI
  web:
    build: .
    container_name: fintechguard-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=your-super-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - redis
    networks:
      - fintech-network

networks:
  fintech-network:
    driver: bridge

volumes:
  redis_data: